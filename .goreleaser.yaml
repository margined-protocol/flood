universal_binaries:
  - id: flood-darwin-universal
    ids:
      - flood-darwin-amd64
      - flood-darwin-arm64
    replace: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: Added
      regexp: "^.*(?i)Add.*$"
      order: 0
    - title: 'Changed'
      regexp: "^(?i).*(Change|Refactor).*$"
      order: 1
    - title: 'Deprecated'
      regexp: "^.*(?i)Deprecate.*$"
      order: 3
    - title: 'Removed'
      regexp: "^.*(?i)Remove.*$"
      order: 4
    - title: 'Fixed'
      regexp: "^.*(?i)Fix.*$"
      order: 5
    - title: 'Security'
      regexp: "^.*(?i)Bump.*$"
      order: 6
    - title: Others
      order: 999

release:
  name_template: "v{{ .Version }}"
  footer: |
    **Full Changelog**: https://github.com/margined-protocol/flood/compare/{{ .PreviousTag }}...{{ if .IsNightly }}nightly{{ else }}{{ .Tag }}{{ end }}
