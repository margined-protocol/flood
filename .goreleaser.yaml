# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 1

env:
  - CGO_ENABLED=1

builds:
  - id: flood-linux-amd64
    main: ./cmd/flood
    binary: flood
    hooks:
      pre:
        - mkdir /tmp/x86_64-linux-gnu
        - wget https://github.com/CosmWasm/wasmvm/releases/download/v1.5.2/libwasmvm_muslc.x86_64.a -O /tmp/x86_64-linux-gnu/libwasmvm_muslc.a
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CC=x86_64-linux-gnu-gcc
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
    - -X 'main.Version={{.Version}}'
    - -X 'main.BuildDate={{.Date}}'
    - -X 'main.commit={{.Commit}}' 
    - -w -s
    - -linkmode=external
    - -extldflags '-Wl,-z,muldefs -static -lm -L/tmp/x86_64-linux-gnu -lwasmvm_muslc'
    tags:
      - muslc
      - osusergo

  - id: flood-linux-arm64
    main: ./cmd/flood
    binary: flood
    hooks:
      pre:
      - mkdir /tmp/aarch64-linux-gnu
      - wget https://github.com/CosmWasm/wasmvm/releases/download/v1.5.2/libwasmvm_muslc.aarch64.a -O /tmp/aarch64-linux-gnu/libwasmvm_muslc.a
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CC=aarch64-linux-gnu-gcc
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -X 'main.Version={{.Version}}'
      - -X 'main.BuildDate={{.Date}}'
      - -X 'main.commit={{.Commit}}' 
      - -w -s
      - -linkmode=external
      - -extldflags '-Wl,-z,muldefs -static -lm -L/tmp/aarch64-linux-gnu -lwasmvm_muslc'
    tags:
      - muslc
      - osusergo

